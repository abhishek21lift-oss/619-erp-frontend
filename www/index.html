<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0c29" />
  <title>Coach Abhishek</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f0c29 0%, #2e1065 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
    }
    .logo { font-size: 48px; font-weight: 900; letter-spacing: -0.04em;
      background: linear-gradient(90deg, #f9a8d4, #c084fc, #818cf8, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; text-transform: uppercase; }
    .spinner { margin-top: 40px; width: 28px; height: 28px; border: 2px solid rgba(167,139,250,0.3);
      border-top-color: #a78bfa; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">CA</div>
  <div class="sub">Coach Abhishek</div>
  <div class="spinner"></div>
  <script>
    // This file is a fallback when the remote server.url is not reachable.
    // The Capacitor config points to the live Vercel deployment.
    // In normal operation this page is never shown.
    setTimeout(function() {
      document.querySelector('.sub').textContent = 'Loading app…';
    }, 1500);
  </script>
</body>
</html>
