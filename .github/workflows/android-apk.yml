name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm for Arborist compatibility
        run: npm install --global npm@11.6.0

      - name: Install project dependencies
        run: npm ci

      - name: Install Capacitor toolchain in isolated environment
        run: |
          mkdir -p "${RUNNER_TEMP}/capacitor-toolchain"
          cd "${RUNNER_TEMP}/capacitor-toolchain"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @capacitor/core@8 @capacitor/android@8
          cp -R node_modules/@capacitor "${GITHUB_WORKSPACE}/node_modules/"

      - name: Install Capacitor CLI
        run: npm install --global --no-audit --no-fund @capacitor/cli@8

      - name: Validate Capacitor toolchain
        run: |
          cap --version
          test -f capacitor.config.ts
          test -f www/index.html
          test -d node_modules/@capacitor/core
          test -d node_modules/@capacitor/android

      - name: Add Android platform
        run: cap add android

      - name: Sync Capacitor
        run: cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 619-ERP-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
