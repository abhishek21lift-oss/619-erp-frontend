name: CI — Lint · Type-check · Test · Build

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  # Manual re-run.
  #
  # GitHub does not trigger `push` workflows for pushes authenticated with an
  # app or bot token — it is a recursion guard. So a commit landed that way
  # gets no CI run at all, and since deploy.yml now waits on CI's conclusion,
  # that means no deploy either: the commit is on main and nothing happens.
  # This button is how such a commit gets a result without an empty commit
  # pushed by hand.
  workflow_dispatch:

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        # Warning ceiling frozen at the current count so the `any`/hooks-deps
        # debt can only shrink — any *new* warning fails CI. Lower this number
        # as warnings are cleaned up.
        #
        # Was 310 while the real count was 230, leaving 80 warnings of silent
        # headroom: new debt could accumulate for months without CI noticing,
        # which defeats the point of a ratchet. Re-measured and tightened.
        run: npm run lint -- --max-warnings=230

  # ── Job 2: Type-check ──────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npm run typecheck

  # ── Job 3: Unit tests ──────────────────────────────────────────────
  # Added after an audit found this pipeline ran lint, type-check, build and
  # audit — but never the tests. 121 of them, including the chart geometry and
  # invitation password-policy suites, had never once executed in CI. A green
  # tick meant "it compiles", not "it works".
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        # No --passWithNoTests. If the suite ever resolves to zero files —
        # a moved directory, a broken glob — that is the failure this job
        # exists to catch, not something to pass quietly.
        run: npm test

  # ── Job 3b: End-to-end ─────────────────────────────────────────────
  #
  # Audit finding H-10. Every other job here mocks one side of a boundary:
  # Vitest mocks fetch, and the backend's Jest suite mocks the pg pool. So the
  # property this product actually sells — that one studio cannot see another's
  # data — was asserted only by tests that mock away the layer where it can
  # fail. This job runs a real browser-grade stack: real Postgres, the real
  # migrations, two seeded studios, the real API.
  #
  # It checks out the BACKEND repo alongside this one, because isolation is a
  # property of the pair and cannot be tested from either alone.
  e2e:
    name: E2E — cross-tenant isolation
    runs-on: ubuntu-latest
    # NOT blocking yet, deliberately.
    #
    # This job needs a cross-repo PAT (see the checkout step). Without it the
    # job fails, and because deploy.yml now gates on CI's conclusion, a failing
    # job here would stop every deploy — turning a missing secret into a
    # release freeze. So it reports without blocking.
    #
    # To make it blocking once E2E_REPO_TOKEN is configured and the job has
    # gone green at least once: delete this line and add `e2e` back to the
    # build job's `needs`.
    continue-on-error: true

    services:
      postgres:
        # pgvector, because migration 046 installs the extension and the chain
        # aborts without it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10

    env:
      # sslmode=disable, because the service container above is a stock
      # Postgres image and stock Postgres is not built with SSL. Without this
      # the job never reached a single test: e2e-setup.sh died on its first
      # psql call with "server does not support SSL, but SSL was required", and
      # the API's own pool asked for SSL unconditionally too, so fixing only
      # the script would have moved the same failure one step later.
      #
      # Both halves read this one parameter now — libpq understands it, and
      # src/db/pool.js parses it out of the URL — so psql and the Node pool
      # cannot end up disagreeing about whether the connection is encrypted.
      # It is safe here and only here: this database is a throwaway container
      # on the runner's own loopback, and e2e-setup.sh refuses to run against
      # anything that looks like a real environment.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/erp_e2e?sslmode=disable
      JWT_SECRET: ci-e2e-secret-at-least-32-characters-long!!
      FRONTEND_URL: http://127.0.0.1:3100
      E2E_API_URL: http://127.0.0.1:5100
      E2E_APP_URL: http://127.0.0.1:3100
      PORT: '5100'

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with: { path: frontend }

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: abhishek21lift-oss/619-erp-backend
          ref: main
          path: backend
          # GITHUB_TOKEN is scoped to THIS repository only — it cannot check
          # out another private repo and fails with a 404. A PAT (or GitHub App
          # token) with read access to the backend repo is required. Until
          # E2E_REPO_TOKEN exists this job cannot run, which is why the job is
          # continue-on-error and the build job does not depend on it.
          token: ${{ secrets.E2E_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Build the database and start the API
        working-directory: backend
        # e2e-setup.sh creates the Supabase-compatible roles, applies
        # schema.sql, runs every migration, seeds two studios, and serves.
        run: |
          nohup npm run e2e:setup > /tmp/api.log 2>&1 &
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:5100/api/health || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          curl -s -o /dev/null -w 'api health: %{http_code}\n' http://127.0.0.1:5100/api/health || (tail -50 /tmp/api.log; exit 1)

      - name: Install frontend
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run the isolation suite
        working-directory: frontend
        # --project=api only: these assert against the API directly, because a
        # leak has to be impossible at the source rather than merely unrendered.
        run: npx playwright test --project=api

      - name: API log on failure
        if: failure()
        run: tail -100 /tmp/api.log

  # ── Job 4: Build ───────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    # Gated on tests too: shipping an artifact from a commit whose tests fail
    # is the exact thing this pipeline is meant to prevent.
    needs: [lint, typecheck, test]
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Upload build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 3
          if-no-files-found: warn

  # ── Job 5: Security scan ───────────────────────────────────────────
  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit shipped dependencies
        # --omit=dev, deliberately.
        #
        # The five open advisories here are all one brace-expansion DoS
        # surfaced through the eslint toolchain. They are dev-only: never in
        # the bundle, never reachable by a user, and the only remedy npm
        # offers is a semver-major eslint upgrade. Forcing the patched
        # brace-expansion via overrides was tried and breaks the tree — it
        # crashes eslint's own config matcher and strips a package
        # @testing-library needs.
        #
        # So the blocking gate audits what actually reaches production. A
        # dev-tool advisory should not block a deploy; a shipped one must.
        run: npm audit --omit=dev --audit-level=high

      # Visible but not blocking, so dev-tool advisories are known rather
      # than either ignored or in the way.
      - name: Report dev-dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
