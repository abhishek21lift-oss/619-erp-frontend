name: Deploy Frontend to VPS

# Runs only after CI has PASSED on main — and on demand.
#
# It used to trigger on `push: main` directly. So did ci.yml, which meant the
# two raced: a commit that failed lint, type-check, tests or the build still
# deployed, because nothing connected the pipelines. That is a sharper problem
# here than in the backend, because ci.yml's `build` job is what proves the
# Next.js app compiles at all — without the gate, a deploy could ship a tree
# that had already failed to build in CI, and the failure would resurface as a
# broken container on the VPS.
#
# `workflow_run` fires when the named workflow COMPLETES, and the job-level
# `if` below requires a successful conclusion.
#
# `workflow_dispatch` stays as the break-glass path: a deploy that can only be
# triggered by a commit is a deploy you cannot repeat, and an operator pressing
# "Run workflow" can see CI's state for themselves.
on:
  workflow_run:
    workflows: ["CI — Lint · Type-check · Test · Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The script lives here so the three attempts below cannot drift apart. It is
# idempotent — pull, build, up -d — so running it twice is the same as running
# it once.
# One deploy at a time, per box.
#
# Both jobs here and rollback.yml SSH into the same VPS and run the same
# idempotent script — fetch, checkout, build, `docker compose up -d`. Idempotent
# means running it twice in SEQUENCE is the same as once; it says nothing about
# running it twice at the SAME time, which is what happens when two commits land
# close together, or when an operator presses "Run workflow" while a
# push-triggered deploy is still going. Two runs then interleave a checkout, a
# Next.js build and a container swap on one working tree, and the box ends up on
# a mixture of two commits with no error anywhere to say so.
#
# `cancel-in-progress: false` on purpose. The default cancels the older run, and
# the older run here is the one that may be halfway through a build or a
# container swap — killing it is how you get a stopped container serving
# nothing. Queue instead: the second deploy waits, then runs against the newer
# commit, which is the state you wanted anyway.
#
# rollback.yml shares this group, because a rollback racing a deploy is the same
# collision with worse consequences.
concurrency:
  group: deploy-vps-frontend
  cancel-in-progress: false

env:
  # ── One command per line, deliberately ─────────────────────────────────
  #
  # The backend's copy of the verification block was multi-line, and it never
  # ran: its deploy log showed the container start and the script exit 1 41ms
  # later, with none of the loop's output. The identical block run as an
  # ordinary script polls correctly, so what could not carry it is the way
  # these lines are assembled and shipped over SSH. Every line that preceded
  # it, across hundreds of deploys, had been exactly one command.
  #
  # Multi-line logic therefore lives in scripts/deploy/, which is one line to
  # call and has tests. The echoed markers are so the log says where it got to.
  DEPLOY_SCRIPT: |
    set -e
    cd /opt/myptstudio/619-erp-frontend
    git fetch origin main
    git checkout main
    git pull --ff-only origin main
    git rev-parse HEAD > /opt/myptstudio/.frontend-deployed-sha.new
    export GIT_SHA="$(git rev-parse HEAD)"
    export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    export APP_VERSION="$(node -p "require('./package.json').version")"
    echo "deploy: building $GIT_SHA"
    cd /opt/myptstudio
    docker compose build --build-arg GIT_SHA="$GIT_SHA" --build-arg BUILD_TIME="$BUILD_TIME" --build-arg APP_VERSION="$APP_VERSION" frontend
    echo "deploy: built; replacing container"
    docker compose up -d frontend
    echo "deploy: container started; verifying it serves $GIT_SHA"
    bash /opt/myptstudio/619-erp-frontend/scripts/deploy/verify-serving.sh "$GIT_SHA" /opt/myptstudio frontend http://127.0.0.1:3000/api/health /opt/myptstudio/.frontend-deployed-sha

jobs:
  deploy:
    runs-on: ubuntu-latest

    # The gate. On workflow_run this requires CI to have concluded 'success';
    # a manual dispatch bypasses it deliberately (see the header).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Report what is being deployed and why it was allowed
        run: |
          echo "Trigger:    ${{ github.event_name }}"
          echo "CI result:  ${{ github.event.workflow_run.conclusion || 'n/a (manual dispatch)' }}"
          echo "Commit:     ${{ github.event.workflow_run.head_sha || github.sha }}"

      # ── Why there are three attempts, and why the waits poll ────────────
      #
      # The runner intermittently cannot reach the VPS on 22:
      #
      #   2026/08/05 06:14:53 dial tcp ***:22: i/o timeout
      #
      # An `i/o timeout` means the TCP handshake never completed — the packets
      # were dropped, not refused. A wrong key gives a rejection, a wrong host
      # gives a DNS error; this is a filter or a box that is not answering.
      #
      # Observed windows: ~10 min on 05 Aug, >10 min on 08 Aug (which
      # swallowed three attempts at 0s, +90s and +5min), and ~25 min on
      # 31 Oct 2026, where the box served HTTPS the whole time while SSH from
      # the runner timed out.
      #
      # The old ladder waited 90s, 5min and 15min with `sleep`. Those waits are
      # blind: they run to the end even after the box answers, so a 6-minute
      # outage still cost 22 minutes, and the deploy started whenever the last
      # sleep expired rather than when SSH came back. These steps poll 22 every
      # 10s and return the moment it opens, so the retry starts within ~10s of
      # recovery and the worst case (20 min of waiting) is unchanged.
      #
      # `continue-on-error` keeps each failure from ending the job; the last
      # attempt has none, so it decides the outcome. This hides a blip, not an
      # outage — and the diagnostic step below fires when the whole ladder
      # fails, so the next occurrence says WHAT was unreachable instead of
      # only that something was.
      - name: Deploy to VPS via SSH
        id: attempt
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # A healthy handshake completes in well under a second. 60s was
          # borrowed from the old 30s default with no evidence it was needed;
          # it only made each failed attempt a full minute of dead time.
          timeout: 20s
          # A cold `docker compose build` of the Next.js image is minutes, and
          # the default 10m has no margin on a busy box.
          command_timeout: 20m
          # Default is OFF, which means the run's exit code is the LAST
          # command's — `docker image prune -f` — so a failed `git pull` would
          # report a green deploy that shipped nothing. Stop at the first error.
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      # Polls instead of sleeping: exits as soon as 22 answers, or after the
      # budget so the next attempt reports the real error. Never fails the job.
      - name: Wait for the box to answer again (up to 10 min)
        if: steps.attempt.outcome == 'failure'
        run: |
          for i in $(seq 1 60); do
            timeout 5 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.HOST }}/22" 2>/dev/null && exit 0
            sleep 10
          done

      - name: Deploy to VPS via SSH (retry 1)
        id: retry1
        continue-on-error: true
        if: steps.attempt.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 20s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait longer (up to 10 min)
        if: steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: |
          for i in $(seq 1 60); do
            timeout 5 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.HOST }}/22" 2>/dev/null && exit 0
            sleep 10
          done

      # The last attempt has no continue-on-error: it decides the job.
      - name: Deploy to VPS via SSH (retry 2)
        if: steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 20s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      # ── What was actually unreachable ───────────────────────────────────
      #
      # `dial tcp ***:22: i/o timeout` says a port did not answer. It does not
      # say whether the box is down, whether only 22 is filtered, or whether
      # the runner's egress is the problem — and those have three different
      # fixes. Every failure so far has left us guessing between them.
      #
      # This probes 22, 80 and 443 and prints the result. If 443 answers while
      # 22 times out, the box is serving and something is filtering SSH
      # (firewall rule, fail2ban, provider-side block) — check `ufw status`,
      # `fail2ban-client status sshd` and the provider console. If nothing
      # answers, the box or its network is down. It never fails the job: the
      # deploy result above is the outcome, this is only evidence.
      - name: Diagnose what the VPS is answering on
        if: failure()
        continue-on-error: true
        run: |
          for port in 22 80 443; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.HOST }}/$port" 2>/dev/null; then
              echo "port $port: OPEN"
            else
              echo "port $port: no answer within 10s"
            fi
          done
          echo "If 443 is open and 22 is not, the box is up and SSH is being filtered."
          echo "If none are open, the box or its network is down."

