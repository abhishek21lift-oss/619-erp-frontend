<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<title>You're offline — MY PT STUDIO</title>
<style>
  :root { --bg:#F8FAFC; --card:#FFFFFF; --ink:#0F172A; --muted:#475569; --border:rgba(15,23,42,.08); --accent:#0067E0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0F172A; --card:#1E293B; --ink:#F1F5F9; --muted:#94A3B8; --border:rgba(241,245,249,.1); }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .card {
    width:100%; max-width:380px; text-align:center; background:var(--card);
    border:1px solid var(--border); border-radius:24px; padding:32px 24px;
    box-shadow: 0 20px 40px -24px rgba(15,23,42,.35);
  }
  img { width:56px; height:56px; border-radius:16px; }
  h1 { font-size:20px; font-weight:800; letter-spacing:-.02em; margin:16px 0 6px; }
  p { font-size:14px; line-height:1.55; color:var(--muted); margin:0 0 20px; }
  button {
    width:100%; height:48px; border:0; border-radius:14px; background:var(--accent);
    color:#fff; font:inherit; font-size:15px; font-weight:700; cursor:pointer;
  }
  button:focus-visible { outline:3px solid rgba(0,103,224,.4); outline-offset:2px; }
  .hint { font-size:12px; margin:14px 0 0; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Your phone isn't connected to the internet right now. Your workouts, messages and progress will be right here when you're back online.</p>
    <button type="button" id="retry">Try again</button>
    <p class="hint" id="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var status = document.getElementById('status');
      function go() { location.reload(); }
      document.getElementById('retry').addEventListener('click', function () {
        if (navigator.onLine === false) { status.textContent = 'Still offline — check Wi-Fi or mobile data.'; return; }
        go();
      });
      window.addEventListener('online', go);
    })();
  </script>
</body>
</html>
